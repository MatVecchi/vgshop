<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>{% block title %}{% endblock title %}</title>
    {% load static %}
  </head>
  <body
    style="
      margin: 0;
      padding: 0;
      background-color: #121620;
      font-family: &quot;Segoe UI&quot;, Tahoma, Geneva, Verdana, sans-serif;
      -webkit-font-smoothing: antialiased;
    "
  >
    <table
      border="0"
      cellpadding="0"
      cellspacing="0"
      width="100%"
      style="background-color: #121620; padding: 20px 0"
    >
      <tr>
        <td align="center">
          <table
            border="0"
            cellpadding="0"
            cellspacing="0"
            width="100%"
            style="
              max-width: 600px;
              background-color: #1a1f2c;
              border-radius: 12px;
              overflow: hidden;
              box-shadow: 0 4px 20px rgba(0, 0, 0, 0.35);
            "
          >
            <tr>
              <td
                align="center"
                style="
                  background-color: #0f121d;
                  padding: 30px 20px;
                  border-bottom: 1px solid #2d3748;
                "
              >
                <h1
                  style="
                    margin: 0;
                    color: #ffffff;
                    font-size: 28px;
                    font-weight: 700;
                    letter-spacing: 2px;
                  "
                >
                  VGshop
                </h1>
              </td>
            </tr>

            {% block content %}{% endblock content %}

            <tr>
              <td
                align="center"
                style="
                  background-color: #0f121d;
                  padding: 25px;
                  border-top: 1px solid #2d3748;
                "
              >
                <p
                  style="
                    margin: 0;
                    color: #64748b;
                    font-size: 12px;
                    line-height: 1.6;
                  "
                >
                  <br />
                  Email inviata automaticamente
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
